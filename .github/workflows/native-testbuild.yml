# Public-only native verification. Installers are verified on the runner but
# never uploaded from CI. Release publication stays in the release workflows.
name: native test build

on:
  push:
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'scripts/verify-native-*.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-testbuild-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.repository.private == false
    name: ${{ matrix.leg }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      # §10: one platform's failure still lets the other three report.
      # Diagnosing "Linux is broken" is faster than "something is broken".
      fail-fast: false
      matrix:
        include:
          - leg: macos-arm64
            # macos-26 (GA 2026-02-26) is the first image whose SDK carries
            # FoundationModels. On macos-15 the Swift bridge cannot compile and
            # `build.rs` degrades to a warning, so the DMG would build green
            # with note summaries silently absent.
            runner: macos-26
            target: aarch64-apple-darwin
            bundles: dmg
            os: macos
            arch: arm64
          - leg: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
            os: macos
            arch: x64
          - leg: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
            os: windows
            arch: x64
          - leg: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            os: linux
            arch: x64

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Identify the tree being built
        id: tree
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # §3: nothing is cross-compiled. Every runner is native to its own
      # architecture, so this only ever confirms the host target is installed.
      - name: Add the Rust target for this leg
        run: rustup target add ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.leg }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ matrix.leg }}-cargo-

      # §3: `libayatana-appindicator3-dev`, never the pre-Ayatana package — asking
      # apt for both is a conflict, not belt and braces. `libfuse2` is for the
      # AppImage bundling step, which runs after the slow part.
      - name: Install the Linux system dependencies
        if: matrix.os == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Install the workspace dependencies
        run: npm ci

      # The log is captured to a file as well as the run log so that a failing
      # leg leaves a downloadable record, not only a page in the Actions UI.
      # `pipefail` is what keeps `tee` from turning a failed build green.
      - name: Build the native package
        env:
          # Layer 2: turn a silent degrade into a build failure, but only where
          # the capability is genuinely owed. Local builds leave this unset so
          # an older Mac still produces a working app.
          SIMPLEMARK_REQUIRE_INTELLIGENCE: ${{ matrix.leg == 'macos-arm64' && '1' || '' }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          npx tauri build --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" \
            2>&1 | tee ".artifacts/native-build-${{ matrix.leg }}.log"

      # Layer 3 of the mac-only-feature contract: assert the capability is in
      # the binary. `build.rs` degrades to a warning when the Swift toolchain
      # cannot produce the bridge — correct for a contributor on an older Mac,
      # catastrophic here, because the build stays green and the capability is
      # simply gone. `SIMPLEMARK_REQUIRE_INTELLIGENCE` above should already have
      # failed the build; this proves the artifact rather than trusting it.
      - name: Assert native capabilities are present
        # macOS only. Windows and Linux own no native capabilities and have no
        # macOS floor, so there is nothing to assert — and their binary is not
        # even called `simplemark` on Windows.
        if: startsWith(matrix.leg, 'macos')
        run: |
          set -euo pipefail
          node scripts/verify-native-capabilities.mjs \
            --binary "src-tauri/target/${{ matrix.target }}/release/simplemark" \
            --leg "${{ matrix.leg }}" \
            ${{ startsWith(matrix.leg, 'macos') && '--max-minos 11.0' || '' }}

      # §3 and §10: assert the bundle at the path Tauri wrote it to *before*
      # renaming, so a Tauri release that changes its output layout fails here
      # instead of uploading nothing. Then §10's real check — the bytes are read
      # and the container signature asserted, because a zipped `dist/` renamed to
      # `.dmg` is the worst failure available and the extension cannot catch it.
      - name: Collect, name, and verify the installers
        run: |
          set -euo pipefail

          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          # Kept relative to the workspace root on purpose. On the Windows
          # runner these are Git Bash paths, and handing `/d/a/...` to a native
          # Windows `node` depends on MSYS argument mangling to come out right.
          out=".artifacts/testbuild"
          mkdir -p "$out"

          collect() {
            format="$1"
            pattern="$2"
            final="$3"
            directory="$bundle/$format"

            if [ ! -d "$directory" ]; then
              echo "native-testbuild: expected bundle directory $directory does not exist" >&2
              exit 1
            fi

            source="$(find "$directory" -maxdepth 1 -type f -name "$pattern" | sort | head -n 1)"
            if [ -z "$source" ]; then
              echo "native-testbuild: no $pattern under $directory" >&2
              exit 1
            fi

            cp "$source" "$out/$final"
            node scripts/verify-native-artifact.mjs \
              --target "${{ matrix.os }}" --artifact "$out/$final" --sha256-sidecar
          }

          case "${{ matrix.os }}" in
            macos)
              collect dmg '*.dmg' "SimpleMark-$version-macos-${{ matrix.arch }}.dmg"
              ;;
            windows)
              collect msi '*.msi' "SimpleMark-$version-windows-x64.msi"
              collect nsis '*.exe' "SimpleMark-$version-windows-x64-setup.exe"
              ;;
            linux)
              collect appimage '*.AppImage' "SimpleMark-$version-linux-x64.AppImage"
              collect deb '*.deb' "SimpleMark-$version-linux-x64.deb"
              ;;
            *)
              echo "native-testbuild: unknown os ${{ matrix.os }}" >&2
              exit 1
              ;;
          esac

          ls -l "$out"

      # Unsigned CI installers must not be published as public artifacts.

      # §10 permits `if: always()` on a diagnostic upload; it is the build output
      # of a leg that may have just failed, and never becomes a shipped artifact.
      - name: Upload the build log
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: simplemark-build-log-${{ matrix.leg }}-${{ github.sha }}
          path: .artifacts/native-build-${{ matrix.leg }}.log
          if-no-files-found: warn
          retention-days: 7

  # iOS does not belong in the matrix above. That matrix exists to produce
  # installers a tester can run, and iOS has none to give: the App Store is the
  # only delivery path, signing needs a provisioning profile no CI runner should
  # hold, and a simulator build proves nothing about a device.
  #
  # What it does need is the check the four legs above give the desktop for
  # free — does the Rust actually compile for this platform. Twice in one
  # afternoon it did not, both times because a crate that has no iOS backend was
  # added for the desktop and nothing objected until a build was run by hand:
  # `notify` gates every backend behind a desktop `target_os`, `trash` has no
  # iOS platform module, and a single-instance lock is meaningless where the
  # system already guarantees one process. Each was found by a person, hours
  # later. `cargo check` finds all three in minutes.
  ios-check:
    if: github.event.repository.private == false
    name: ios-arm64 (check)
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Add the iOS Rust target
        run: rustup target add aarch64-apple-ios

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ios-check-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ios-check-cargo-

      - name: Install the workspace dependencies
        run: npm ci

      # `tauri-build` resolves the configured frontend output during `build.rs`,
      # so the bundle has to exist before the crate can be checked at all. This
      # is the same `vite build` the desktop legs get from `tauri build`.
      - name: Build the frontend
        run: npm run build

      # Deliberately `check`, not `build`: linking a static library for a device
      # adds minutes and proves nothing extra here. Every failure this job is
      # meant to catch — a crate with no iOS backend, an unguarded desktop-only
      # call, a `cfg` that lets one through — is a type or resolution error, and
      # surfaces at check time.
      #
      # And deliberately `--lib`, not `--all-targets`. The test targets pull in
      # `muda`, which is a dev-dependency precisely because it is the desktop
      # menubar's own accelerator parser — it has no iOS platform module and
      # fails to resolve `platform_impl` for this target. Checking it here would
      # make this job permanently red for a reason that has nothing to do with
      # the app iOS ships. The library is what goes on the phone; the library is
      # what is checked.
      - name: Check that the Rust compiles for iOS
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-apple-ios --lib \
            2>&1 | tee .artifacts/native-build-ios-check.log

      # Named to the same convention as the four desktop legs, because §10
      # allows `always()` on a diagnostic build log and on nothing else — this
      # is that log for the leg that has no installer to upload beside it.
      - name: Upload the build log
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: simplemark-build-log-ios-check-${{ github.sha }}
          path: .artifacts/native-build-ios-check.log
          if-no-files-found: warn
          retention-days: 7
