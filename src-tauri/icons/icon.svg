<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">SimpleMark</title>
  <desc id="desc">Three movable document blocks in glass and white on an ocean gradient tile, with a four-point spark.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38B6FF"/><stop offset=".55" stop-color="#1A6DFF"/><stop offset="1" stop-color="#3D2BFF"/>
    </linearGradient>
    <linearGradient id="top-light" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity=".28"/><stop offset=".6" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity=".78"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".38"/>
    </linearGradient>
    <linearGradient id="glass-rim" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity=".95"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#DDEEFF"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="190%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#001B4D" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect x="60" y="60" width="904" height="904" rx="206" fill="url(#tile)"/>
  <rect x="60" y="60" width="904" height="904" rx="206" fill="url(#top-light)"/>
  <g filter="url(#shadow)">
    <rect x="270" y="250" width="440" height="130" rx="40" fill="url(#glass)" stroke="url(#glass-rim)" stroke-width="8" transform="rotate(6 490 315)"/>
    <rect x="290" y="440" width="440" height="130" rx="40" fill="#FFFFFF"/>
    <rect x="250" y="630" width="440" height="130" rx="40" fill="url(#glass)" stroke="url(#glass-rim)" stroke-width="8"/>
  </g>
  <path transform="translate(825 625) scale(.65)" d="M0-100C6-40 40-6 100 0 40 6 6 40 0 100-6 40-40 6-100 0-40-6-6-40 0-100z" fill="url(#spark)"/>
</svg>
